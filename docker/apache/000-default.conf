<VirtualHost *:80>
    ServerName _
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Ces répertoires sont destinés aux inclusions PHP, pas à un accès HTTP direct.
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    <Directory /var/www/html/scripts>
        Require all denied
    </Directory>

    <Files "debug.php">
        Require all denied
    </Files>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
